<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      /* Importing the signature 7x7 font */
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&amp;display=swap');
      
      .favicon-text {
        font-family: 'Playfair Display', serif;
        font-weight: 800;
        font-style: italic;
        font-size: 46px;
        fill: #b03e28;
      }
    </style>
  </defs>

  <!-- Soft rounded background for browser tab visibility -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="#eedcd3" />

  <!-- Perfectly centered 7x7 text -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" class="favicon-text">7x7</text>
</svg>
